<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b59"/>
      <stop offset="100%" stop-color="#07142b"/>
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Golden Wreath / Eagle Wings Outer Silhouette -->
  <g filter="url(#shadow)">
    <!-- Outer Eagle Wings Left -->
    <path d="M 250,110 C 220,70 170,50 110,65 C 100,95 110,130 135,160 C 100,165 80,195 85,225 C 105,240 135,245 160,240 C 130,260 120,295 135,325 C 160,335 190,325 215,300 C 210,330 220,360 250,380 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    
    <!-- Outer Eagle Wings Right -->
    <path d="M 250,110 C 280,70 330,50 390,65 C 400,95 390,130 365,160 C 400,165 420,195 415,225 C 395,240 365,245 340,240 C 370,260 380,295 365,325 C 340,335 310,325 285,300 C 290,330 280,360 250,380 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    
    <!-- Eagle Head & Crown -->
    <path d="M 235,80 C 240,60 260,60 265,80 C 280,85 285,100 270,110 L 230,110 C 215,100 220,85 235,80 Z" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
    <polygon points="250,55 240,75 260,75" fill="#f59e0b"/>
  </g>

  <!-- Central Heraldic Shield -->
  <g filter="url(#shadow)">
    <path d="M 250,130 C 320,130 330,160 330,220 C 330,300 280,360 250,390 C 220,360 170,300 170,220 C 170,160 180,130 250,130 Z" fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="6"/>
    
    <!-- Inner Shield Border -->
    <path d="M 250,142 C 310,142 318,170 318,220 C 318,290 274,345 250,372 C 226,345 182,290 182,220 C 182,170 190,142 250,142 Z" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  </g>

  <!-- Engineering Cog / Gear -->
  <g transform="translate(250,230)">
    <circle r="46" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <!-- Gear teeth -->
    <g fill="#fbbf24">
      <rect x="-6" y="-55" width="12" height="12" rx="2"/>
      <rect x="-6" y="43" width="12" height="12" rx="2"/>
      <rect x="-55" y="-6" width="12" height="12" rx="2"/>
      <rect x="43" y="-6" width="12" height="12" rx="2"/>
      <rect x="-40" y="-40" width="12" height="12" rx="2" transform="rotate(45)"/>
      <rect x="28" y="-40" width="12" height="12" rx="2" transform="rotate(45)"/>
      <rect x="-40" y="28" width="12" height="12" rx="2" transform="rotate(45)"/>
      <rect x="28" y="28" width="12" height="12" rx="2" transform="rotate(45)"/>
    </g>
    <!-- Lightning Bolt (Ingeniería Eléctrica) -->
    <polygon points="4,-35 -20,5 2,5 -6,35 22,-5 -2,-5" fill="#facc15" stroke="#78350f" stroke-width="1.5" filter="drop-shadow(0 0 4px #eab308)"/>
  </g>

  <!-- Banner CFP at bottom -->
  <g filter="url(#shadow)">
    <path d="M 160,395 L 340,395 L 325,435 L 250,425 L 175,435 Z" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <text x="250" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" fill="#fbbf24" letter-spacing="4">CFP</text>
  </g>

</svg>
